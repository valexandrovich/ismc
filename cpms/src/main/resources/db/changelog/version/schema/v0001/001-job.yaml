databaseChangeLog:
  - changeSet:
      id: schema-v0001-001
      author: valex
      changes:
        - sql:
            sql: |
              create table cpms.job
              (
              id             bigint generated by default as identity primary key,
              short_name     varchar(255),
              name           varchar(255),
              source         varchar(255),
              started_at     timestamp(6),
              finished_at    timestamp(6),
              initiator_name varchar(255)
              );
              
              create index job__started_at__index  on cpms.job (started_at);
              
