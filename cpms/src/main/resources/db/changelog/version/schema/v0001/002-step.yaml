databaseChangeLog:
  - changeSet:
      id: schema-v0001-002
      author: valex
      changes:
        - sql:
            sql: |
              create table cpms.step
                (
                id           bigint generated by default as identity primary key,
                job_id       bigint constraint step__job__fk references cpms.job,
                step_order   integer,
                service      varchar(255),
                worker       varchar(255),
                started_at   timestamp(6),
                finished_at  timestamp(6),
                progress     double precision,
                status       varchar(255),
                comment      text,
                is_skippable boolean
                );
              
              create index step__started_at__index on cpms.step (started_at);