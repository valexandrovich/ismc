databaseChangeLog:
  - changeSet:
      id: schema-v001
      author: valex
      changes:
        - sql:
            sql: |
                create table sys.access_rule
                    (
                    id     bigint generated by default as identity primary key,
                    method varchar(255),
                    path   varchar(255),
                    role   varchar(255)
                    );
               
                create unique index access_rule__uindex
                on sys.access_rule (method, path);





