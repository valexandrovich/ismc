databaseChangeLog:
  - changeSet:
      id: schema-v0001-002
      author: valex
      changes:
        - sql:
            sql: |
              create table scheduler.stored_step
                (
                id            bigint generated by default as identity primary key,
                stored_job_id bigint constraint stored_step__stored_job__fk references scheduler.stored_job,
                step_order    integer,
                service  varchar(255),
                worker   varchar(255),
                is_enabled    boolean,
                is_skippable  boolean
                );