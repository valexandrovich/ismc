databaseChangeLog:
  - changeSet:
      id: schema-v0001-003
      author: valex
      changes:
        - sql:
            sql: |
              create table scheduler.stored_step_parameter
                (
                    stored_step_id bigint       not null
                        constraint stored_step_parameter__stored_step__fk
                            references scheduler.stored_step,
                    key            varchar(255) not null,
                    value          varchar(255),
                    primary key (stored_step_id, key)
                );
