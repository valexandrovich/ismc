databaseChangeLog:
  - changeSet:
      id: schema-v0001-001
      author: valex
      changes:
        - sql:
            sql: |
              create table scheduler.stored_job
                (
                id               bigint generated by default as identity primary key,
                short_name       varchar(255),
                name             varchar(255),
                source           varchar(255),
                is_enabled       boolean
                );
              
                
              
              
