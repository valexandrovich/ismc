databaseChangeLog:
  - changeSet:
      id: schema-v0001-007
      author: valex
      changes:
        - sql:
            sql: |
              create table red.govua_11
                  (
                      hash                uuid not null primary key,
                      create_revision_id  bigint,
                      update_revision_id  bigint,
                      disable_revision_id bigint,
                      create_date         timestamp(6),
                      update_date         timestamp(6),
                      disable_date        timestamp(6),
                      nn                  varchar(255),
                      status              varchar(255),
                      series              varchar(255),
                      number              varchar(255),
                      date_edit           date
                  );
  
  
                  create index govua_11__series__index on red.govua_11 (series);
                  create index govua_11__number__index on red.govua_11 (number);
                



