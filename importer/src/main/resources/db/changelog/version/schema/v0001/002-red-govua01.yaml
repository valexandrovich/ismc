databaseChangeLog:
  - changeSet:
      id: schema-v0001-002
      author: valex
      changes:
        - sql:
            sql: |
              create table red.govua_01
                (
                hash                  uuid not null primary key,
                create_revision_id    bigint,
                update_revision_id    bigint,
                disable_revision_id   bigint,
                create_date           timestamp(6),
                update_date           timestamp(6),
                disable_date          timestamp(6),
                number                bigint,
                date                  date,
                type                  varchar(255),
                firm_edrpou           varchar(255),
                firm_name             varchar(255),
                case_number           varchar(255),
                start_date_auc        date,
                end_date_auc          date,
                court_name            varchar(255),
                end_registration_date date
                );
              
              create index govua_01__firm_edrpou__index on red.govua_01 (firm_edrpou);
              create index govua_01__firm_name__index on red.govua_01 (firm_name);
              
              

             
