databaseChangeLog:
  - changeSet:
      id: schema-v0001-004
      author: valex
      changes:
        - sql:
            sql: |
                   create table red.govua_08
                    (
                        hash                uuid not null primary key,
                        create_revision_id  bigint,
                        update_revision_id  bigint,
                        disable_revision_id bigint,
                        create_date         timestamp(6),
                        update_date         timestamp(6),
                        disable_date        timestamp(6),
                        id                  varchar(255),
                        ovd                 varchar(255),
                        category            varchar(255),
                        last_name_ua        varchar(255),
                        first_name_ua       varchar(255),
                        patronymic_name_ua  varchar(255),
                        last_name_ru        varchar(255),
                        first_name_ru       varchar(255),
                        patronymic_name_ru  varchar(255),
                        last_name_en        varchar(255),
                        first_name_en       varchar(255),
                        patronymic_name_en  varchar(255),
                        birthday            date,
                        sex                 varchar(255),
                        lost_date           date,
                        lost_place          varchar(255),
                        article_crim        varchar(255),
                        restraint           varchar(255),
                        contact             varchar(255),
                        photoid             varchar(255)
                    );
       
       
                     create index govua_08__last_name_ua__index on red.govua_08 (last_name_ua);
                     create index govua_08__first_name_ua__index on red.govua_08 (first_name_ua);
                     create index govua_08__patronymic_name_ua__index on red.govua_08 (patronymic_name_ua);
                     
                     create index govua_08__last_name_ru__index on red.govua_08 (last_name_ru);
                     create index govua_08__first_name_ru__index on red.govua_08 (first_name_ru);
                     create index govua_08__patronymic_name_ru__index on red.govua_08 (patronymic_name_ru);
                     
                     create index govua_08__last_name_en__index on red.govua_08 (last_name_en);
                     create index govua_08__first_name_en__index on red.govua_08 (first_name_en);
                     create index govua_08__patronymic_name_en__index on red.govua_08 (patronymic_name_en);
              
              
              
              


              
              

             
