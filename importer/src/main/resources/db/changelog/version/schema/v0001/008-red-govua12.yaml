databaseChangeLog:
  - changeSet:
      id: schema-v0001-008
      author: valex
      changes:
        - sql:
            sql: |
                  create table red.govua_12
                  (
                      hash                uuid not null primary key,
                      create_revision_id  bigint,
                      update_revision_id  bigint,
                      disable_revision_id bigint,
                      create_date         timestamp(6),
                      update_date         timestamp(6),
                      disable_date        timestamp(6),
                      id                  varchar(255),
                      ovd                 varchar(255),
                      series              varchar(255),
                      number              varchar(255),
                      type                varchar(255),
                      status              varchar(255),
                      theft_date          date,
                      insert_date         date
                  );
              
              
              
                  create index govua_12__series__index on red.govua_12 (series);
                  create index govua_12__number__index on red.govua_12 (number);


