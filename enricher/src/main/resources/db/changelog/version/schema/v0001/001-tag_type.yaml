databaseChangeLog:
  - changeSet:
      id: schema-v0001-001
      author: valex
      changes:
        - sql:
            sql: |
                  create table data.tag_type
                  (
                  id                  bigint generated by default as identity primary key,
                  level_1_code        varchar(255),
                  level_2_code        varchar(255),
                  level_3_code        varchar(255),
                  level_4_code        varchar(255),
                  level_5_code        varchar(255),
                  code                varchar(255),
                  level_1_description varchar(255),
                  level_2_description varchar(255),
                  level_3_description varchar(255),
                  level_4_description varchar(255),
                  level_5_description varchar(255),
                  description         varchar(255)
                  );
                              
