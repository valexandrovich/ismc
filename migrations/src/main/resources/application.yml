spring:
  application:
    name: migrations

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}